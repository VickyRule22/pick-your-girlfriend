<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<title>AI Tech Girlfriends Style Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Archivo+Black&family=Abril+Fatface&family=Bungee&family=Rubik+Mono+One&family=Silkscreen&family=Special+Elite&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&family=Karla:wght@400;600;700&display=swap">
<style>
/* Layout: one readable column of zine paper on the pink aisle, sticky contents rail on wide screens. Single committed light look. */
:root{
  --aisle:#fde3ec; --ink:#2a1420; --muted:#7d5a68; --hot:#ff2e88; --hot2:#c4005c; --cream:#fff8ef; --mint:#a8ecd2; --gold:#ffd84a; --blue:#2f5fe0; --tape:rgba(255,120,170,.55); --line:#f1c6d6;
  --type:"Courier Prime","Courier New",monospace; --body:"Karla",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--aisle);color:var(--ink);font:17px/1.6 var(--body);
  background-image:radial-gradient(circle at 1px 1px,rgba(255,46,136,.18) 1.2px,transparent 1.6px);background-size:22px 22px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:18px;padding-block:28px 80px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:10px}
@media (max-width:900px){.rail{position:static}}
.dl{display:inline-block;background:var(--hot);color:#fff;text-decoration:none;font:400 18px/1 "Shrikhand",serif;padding:14px 18px;border-radius:30px;box-shadow:0 4px 0 var(--hot2);text-align:center;transition:transform .15s ease-out,box-shadow .15s ease-out}
.dl:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--hot2)}
.dl:focus-visible,.toc a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.rail small{font:12px/1.4 var(--type);color:var(--muted)}
.toc{display:grid;gap:2px;margin-top:8px}
@media (max-width:900px){.toc{display:none}}
.toc a{font:700 13px/1.3 var(--type);color:var(--ink);text-decoration:none;padding:5px 8px;border-radius:6px}
.toc a:hover{background:#fff}
.paper{background:var(--cream);padding:34px clamp(18px,4vw,48px) 40px;box-shadow:0 2px 0 var(--line),6px 8px 0 rgba(196,0,92,.12);position:relative;min-width:0}
.paper::before{content:"";position:absolute;top:-11px;left:48px;width:96px;height:24px;background:var(--tape);transform:rotate(-5deg)}
.paper::after{content:"";position:absolute;top:-9px;right:60px;width:70px;height:22px;background:var(--tape);transform:rotate(4deg)}
#doc > *:first-child{margin-top:0}
#doc h1{margin:0 0 6px;font-size:clamp(30px,5vw,52px);line-height:1}
#doc h2{margin:48px 0 14px;font:400 clamp(26px,3.6vw,34px)/1.1 "Shrikhand",serif;color:var(--hot2);scroll-margin-top:16px}
#doc h3{margin:28px 0 8px;font:700 19px/1.2 var(--body)}
#doc p,#doc li{max-width:68ch}
#doc ul{padding-left:22px}
#doc li{margin:4px 0}
#doc li::marker{color:var(--hot)}
#doc strong{color:var(--ink)}
#doc em{color:var(--muted)}
#doc hr{border:0;border-top:2px dashed var(--line);margin:36px 0}
#doc code{font:700 14px var(--type);background:#fff;border:1px solid var(--line);padding:1px 6px;border-radius:5px;white-space:nowrap}
#doc a{color:var(--hot2)}
.tbl{overflow-x:auto;margin:14px 0}
#doc table{border-collapse:collapse;width:100%;font-size:15px;background:#fff;box-shadow:0 2px 0 var(--line)}
#doc th{font:700 12px/1.3 var(--type);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);background:#fff6fa}
#doc td{padding:10px 12px;border-bottom:1px solid #f6dfe8;vertical-align:top}
.sw{display:inline-block;width:22px;height:22px;border-radius:5px;vertical-align:-6px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.kicker{font:700 14px var(--type);letter-spacing:.06em;color:var(--muted)}
/* cut-out letters */
.rn{display:flex;flex-wrap:wrap;gap:5px .35em;align-items:center}
.rn .w{display:inline-flex;gap:3px;white-space:nowrap}
.rn b{display:inline-block;font-weight:400;line-height:1;padding:4px 6px 2px;box-shadow:1px 2px 0 rgba(0,0,0,.22)}
.c1{font-family:"Abril Fatface",serif;background:#fff;color:var(--hot2);outline:1px solid #f1d3df}.c2{font-family:"Bungee",sans-serif;background:#111;color:var(--mint)}.c3{font-family:"Rubik Mono One",sans-serif;background:#fff6c9;color:#111}.c4{font-family:"Silkscreen",monospace;background:var(--mint);color:#7a0038}.c5{font-family:"Special Elite",monospace;background:#fff;color:#111}.c6{font-family:"Abril Fatface",serif;background:var(--blue);color:#fff;font-style:italic}.c7{font-family:"Shrikhand",serif;background:var(--hot);color:#fff}.c8{font-family:"Archivo Black",sans-serif;background:var(--gold);color:var(--hot2)}
.loading{font:600 22px var(--hand,"Caveat",cursive);color:var(--muted)}
</style>
<style>
.pbar{background:#2a1420;color:#ffd3e6;font:700 12px/1 "Courier Prime","Courier New",monospace;letter-spacing:.06em;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 16px 9px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.pbar .pb-brand{display:flex;align-items:center;gap:8px;text-transform:uppercase;white-space:nowrap}
.pbar .pb-dot{width:8px;height:8px;border-radius:50%;background:#ff2e88;box-shadow:0 0 0 3px rgba(255,46,136,.3)}
.pbar .pb-pill{background:#ffd84a;color:#2a1420;padding:3px 7px;border-radius:10px}
.pbar nav{display:flex;gap:4px;flex-wrap:wrap}
.pbar nav a{color:#ffd3e6;text-decoration:none;padding:6px 10px;border-radius:14px;white-space:nowrap}
.pbar nav a:hover{background:rgba(255,255,255,.1)}
.pbar nav a[aria-current]{background:#ff2e88;color:#fff}
.pbar nav a:focus-visible{outline:2px solid #ffd84a;outline-offset:2px}
.pbar .pb-note{margin-left:auto;color:#bfa3b0;font-weight:400;white-space:nowrap}
@media (max-width:640px){.pbar .pb-note{display:none}}
</style>
<div class="pbar" role="banner">
  <span class="pb-brand"><span class="pb-dot" aria-hidden="true"></span>AI Tech Girlfriends <span class="pb-pill">prototype</span></span>
  <nav aria-label="Prototype pages"><a href="../">Pick your girlfriend</a><a href="../type.html">Type samples</a><a href="../style-guide/" aria-current="page">Style guide</a></nav>
  <span class="pb-note">concept work · not for sale</span>
</div>


<div class="wrap">
  <aside class="rail">
    <a class="dl" href="STYLE_GUIDE.md" download="AI-Tech-Girlfriends-Style-Guide.md">Download .md ↓</a>
    <small>Markdown, so it drops straight into Notion, Google Docs or a Claude chat.</small>
    <nav class="toc" id="toc" aria-label="Contents"></nav>
  </aside>
  <article class="paper"><div id="doc"><p class="loading">loading the style guide…</p></div></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
function ransom(el,txt){let s=[...txt].reduce((a,c)=>a+c.charCodeAt(0),7);const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  el.textContent='';el.classList.add('rn');el.setAttribute('aria-label',txt);
  txt.split(' ').forEach(word=>{const w=document.createElement('span');w.className='w';w.setAttribute('aria-hidden','true');
    [...word].forEach(ch=>{const b=document.createElement('b');b.className='c'+(1+Math.floor(r()*8));b.textContent=r()>.5?ch.toUpperCase():ch.toLowerCase();
      b.style.transform=`rotate(${(r()*8-4).toFixed(1)}deg) translateY(${(r()*4-2).toFixed(1)}px)`;w.appendChild(b)});el.appendChild(w)})}
fetch('STYLE_GUIDE.md').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(md=>{
  const doc=document.getElementById('doc');doc.innerHTML=marked.parse(md);
  const h1=doc.querySelector('h1');if(h1)ransom(h1,'Style guide');
  const k=h1&&h1.nextElementSibling;if(k&&k.tagName==='P')k.className='kicker';
  doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.before(w);w.appendChild(t)});
  doc.querySelectorAll('td code').forEach(c=>{if(/^#[0-9a-f]{6}$/i.test(c.textContent)){const s=document.createElement('span');s.className='sw';s.style.background=c.textContent;c.before(s)}});
  const toc=document.getElementById('toc');
  doc.querySelectorAll('h2').forEach((h,i)=>{h.id='s'+(i+1);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.appendChild(a)});
}).catch(()=>{document.getElementById('doc').innerHTML='<p>The guide didn\'t load. Use the download button to get the .md file instead.</p>'});
</script>
